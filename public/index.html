<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trendsplant · Smart PLP Ordering</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17212b}header{background:#123c2c;color:#fff;padding:32px 6vw;position:relative}main{max-width:1100px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #dfe5e9;border-radius:14px;padding:22px}label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700}input,select{width:100%;padding:10px;border:1px solid #ccd6dc;border-radius:8px;box-sizing:border-box}button{padding:11px 15px;border:0;border-radius:8px;background:#18794e;color:#fff;font-weight:700;margin:14px 8px 0 0}.login{position:absolute;right:6vw;top:30px;background:#fff;color:#123c2c;margin:0}.weight{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0}.score{color:#18794e;font-weight:800}.hint{font-size:12px;color:#61717b}@media(max-width:760px){.grid{grid-template-columns:1fr}.login{position:static;margin-top:12px}}</style></head>
<body><header><small>TRENDSPLANT · SHOPIFY CUSTOM APP</small><h1>Smart PLP Ordering</h1><p>Configura y simula la estrategia de ordenación.</p><button class="login" id="login">Iniciar sesión Shopify</button></header><main><section class="card" id="auth"><h2>Acceso</h2><label>Tienda Shopify<input id="shop" placeholder="tu-tienda.myshopify.com"></label><p class="hint">Necesario para conectar la app con el panel de Shopify.</p></section><div class="grid"><section class="card"><h2>Estrategia</h2><label>Colección<input id="collection"></label><label>Modo<select id="mode"><option value="simulation">Simulación</option><option value="live">Live</option></select></label><div id="weights"></div><label><input type="checkbox" id="stock"> Excluir productos sin stock</label><button id="save">Guardar configuración</button><button id="apply">Aplicar estrategia</button><p id="status">Cargando…</p></section><section class="card"><h2>Simulador</h2><label>País<input id="country" value="ES"></label><label>Temperatura °C<input id="temperature" type="number" value="22"></label><button id="simulate">Simular ranking</button><div id="results"></div></section></div></main><script>
const names={temperatureFit:"Temperatura",countryAffinity:"País",recentSales:"Ventas recientes",newness:"Novedad",availability:"Disponibilidad"};let s;const $=id=>document.getElementById(id);
async function load(){s=await(await fetch("/api/strategy")).json();$("collection").value=s.collectionHandle;$("mode").value=s.mode;$("stock").checked=s.exclusions.excludeOutOfStock;$("weights").innerHTML=Object.entries(names).map(([k,n])=>`<div class="weight"><label>${n}<input id="w-${k}" type="range" min="0" max="100" value="${s.weights[k]}"></label><output>${s.weights[k]}%</output></div>`).join("");const q=new URLSearchParams(location.search);if(q.get("login")==="success")$("status").textContent="Sesión Shopify iniciada.";const session=await(await fetch("/api/session")).json();if(session.authenticated){$("shop").value=session.shop;$("auth").querySelector("h2").textContent="Conectado a Shopify";$("status").textContent="Sesión activa en "+session.shop}else $("status").textContent="Configuración cargada."}
$("login").onclick=()=>{const shop=$("shop").value.trim().replace(/^https?:\/\//,"");if(!shop)return alert("Indica el dominio .myshopify.com de la tienda.");location.href="/api/auth/shopify?shop="+encodeURIComponent(shop)};
$("save").onclick=async()=>{s.collectionHandle=$("collection").value;s.mode=$("mode").value;s.exclusions.excludeOutOfStock=$("stock").checked;Object.keys(names).forEach(k=>s.weights[k]=+$("w-"+k).value);s=await(await fetch("/api/strategy",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(s)})).json();$("status").textContent="Configuración guardada."};
$("apply").onclick=async()=>{const d=await(await fetch("/api/strategy/apply",{method:"POST"})).json();$("status").textContent=d.error||d.message};
$("simulate").onclick=async()=>{const d=await(await fetch("/api/strategy/simulate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({country:$("country").value,temperatureC:$("temperature").value})})).json();$("results").innerHTML=d.ranked.map((p,i)=>`<div class="rank"><span>${i+1}. ${p.title}</span><span class="score">${p.score}</span></div>`).join("")};load();
</script></body></html>
